name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        id: terraform
        run: |
          cd terraform
          terraform init -backend-config=backend.hcl
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "user_pool_id=$(terraform output -raw user_pool_id)" >> $GITHUB_OUTPUT
          echo "user_pool_client_id=$(terraform output -raw user_pool_client_id)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Create production environment file
        run: |
          cd frontend
          echo "VITE_API_URL=${{ steps.terraform.outputs.api_url }}" > .env.production
          echo "✓ Created .env.production with API URL"

      - name: Build frontend
        env:
          VITE_USER_POOL_ID: ${{ steps.terraform.outputs.user_pool_id }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.terraform.outputs.user_pool_client_id }}
        run: |
          cd frontend
          npm run build

      - name: Sync to S3
        run: |
          cd frontend
          aws s3 sync dist/ s3://${{ steps.terraform.outputs.bucket }}/ --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ steps.terraform.outputs.bucket }}/index.html --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform.outputs.distribution_id }} \
            --paths "/*"

      - name: Wait for invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront list-invalidations \
            --distribution-id ${{ steps.terraform.outputs.distribution_id }} \
            --query 'InvalidationList.Items[0].Id' \
            --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.terraform.outputs.distribution_id }} \
            --id $INVALIDATION_ID

      - name: Summary
        run: |
          echo "## Frontend Deployed 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.terraform.outputs.cloudfront_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${{ steps.terraform.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.terraform.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.terraform.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
