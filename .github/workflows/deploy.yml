name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Required GitHub Secrets:
# - AWS_ROLE_ARN: IAM role ARN for OIDC authentication
#
# Required AWS Secrets Manager secrets (must be created before first deploy):
# - voyager-prod/gemini-api-key: Gemini AI API key
# - voyager-prod/serpapi-api-key: SerpAPI key for flight/hotel searches
# - voyager-prod-db-master-password: Auto-created by Terraform (JSON format with password field)

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  infrastructure:
    name: Infrastructure & Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true' || needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/infrastructure.yml
    secrets: inherit
